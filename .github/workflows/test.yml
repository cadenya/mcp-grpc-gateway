name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go and Proto Checks
    runs-on: ubuntu-latest
    env:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Test
        run: go test ./...

      - name: Race Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/mcp-grpc-gateway

      - name: Buf Lint
        run: buf lint

      - name: Build Descriptor Set
        run: buf build . --as-file-descriptor-set -o /tmp/mcp-grpc-gateway-descriptor.binpb

      - name: Push Proto Module
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.BUF_TOKEN != ''
        run: buf push
