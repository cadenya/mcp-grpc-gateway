syntax = "proto3";

package functional.v1;

option go_package = "cadenya.com/mcp-grpc-gateway/internal/testpb;testpb";

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  PRIORITY_HIGH = 2;
}

message ComplexMetadata {
  string source = 1;
  repeated string tags = 2;
}

message ComplexTarget {
  string id = 1;
  ComplexMetadata metadata = 2;
}

message ComplexRequest {
  Priority priority = 1;
  ComplexMetadata metadata = 2;
  repeated ComplexTarget targets = 3;
  map<string, ComplexTarget> target_by_key = 4;
  map<string, ComplexMetadata> metadata_by_key = 5;
  repeated Priority priorities = 6;
}
