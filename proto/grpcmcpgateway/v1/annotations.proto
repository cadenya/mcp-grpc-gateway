syntax = "proto3";

package grpcmcpgateway.v1;

import "google/protobuf/descriptor.proto";

option go_package = "go.cadenya.com/mcp-grpc-gateway/gen/grpcmcpgateway/v1;grpcmcpgatewayv1";

// Server is deprecated and is not read by the gateway runtime. Configure MCP
// server metadata with the gateway's --mcp-* flags or MCP_* environment
// variables instead.
message Server {
  string name = 1;
  string title = 2;
  string version = 3;
  string instructions = 4;
  string website_url = 5;
  repeated Icon icons = 6;
}

message Icon {
  string src = 1;
  string mime_type = 2;
  repeated string sizes = 3;
}

message Tool {
  string name = 1;
  string description = 2;
  // content_template is a Go text/template rendered against the gRPC
  // response (protojson camelCase keys, e.g. {{ .content }}). When set, the
  // MCP tool returns only the rendered text and no structured content.
  string content_template = 3;
}

// Service configures how a reflected gRPC service is exposed as MCP tools.
message Service {
  string tool_prefix = 1;
}

message Field {
  string description = 1;
}

extend google.protobuf.ServiceOptions {
  Server server = 80083 [deprecated = true];
  Service service = 80086;
}

extend google.protobuf.MethodOptions {
  Tool tool = 80084;
}

extend google.protobuf.FieldOptions {
  Field field = 80085;
}
