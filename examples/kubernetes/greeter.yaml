apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter
  labels:
    app.kubernetes.io/name: greeter
    app.kubernetes.io/part-of: mcp-grpc-gateway-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: greeter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: greeter
        app.kubernetes.io/part-of: mcp-grpc-gateway-example
    spec:
      containers:
        - name: greeter
          image: mcp-grpc-gateway-greeter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: greeter
  labels:
    app.kubernetes.io/name: greeter
    app.kubernetes.io/part-of: mcp-grpc-gateway-example
spec:
  selector:
    app.kubernetes.io/name: greeter
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
