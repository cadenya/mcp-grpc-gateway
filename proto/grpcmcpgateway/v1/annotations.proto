syntax = "proto3";

package grpcmcpgateway.v1;

import "google/protobuf/descriptor.proto";

option go_package = "cadenya.com/mcp-grpc-gateway/gen/grpcmcpgateway/v1;grpcmcpgatewayv1";

message Server {
  string name = 1;
  string title = 2;
  string version = 3;
  string instructions = 4;
  string website_url = 5;
  repeated Icon icons = 6;
}

message Icon {
  string src = 1;
  string mime_type = 2;
  repeated string sizes = 3;
}

message Tool {
  string name = 1;
  string description = 2;
}

extend google.protobuf.ServiceOptions {
  Server server = 51000;
}

extend google.protobuf.MethodOptions {
  Tool tool = 51001;
}
