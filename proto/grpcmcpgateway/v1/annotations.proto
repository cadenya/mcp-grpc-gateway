syntax = "proto3";

package grpcmcpgateway.v1;

import "google/protobuf/descriptor.proto";

option go_package = "go.cadenya.com/mcp-grpc-gateway/gen/grpcmcpgateway/v1;grpcmcpgatewayv1";

// Server is deprecated and is not read by the gateway runtime. Configure MCP
// server metadata with the gateway's --mcp-* flags or MCP_* environment
// variables instead.
message Server {
  string name = 1;
  string title = 2;
  string version = 3;
  string instructions = 4;
  string website_url = 5;
  repeated Icon icons = 6;
}

message Icon {
  string src = 1;
  string mime_type = 2;
  repeated string sizes = 3;
}

message Tool {
  string name = 1;
  string description = 2;
}

message Field {
  string description = 1;
}

extend google.protobuf.ServiceOptions {
  Server server = 80083 [deprecated = true];
}

extend google.protobuf.MethodOptions {
  Tool tool = 80084;
}

extend google.protobuf.FieldOptions {
  Field field = 80085;
}
