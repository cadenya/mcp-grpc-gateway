apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-grpc-gateway
  labels:
    app.kubernetes.io/name: mcp-grpc-gateway
    app.kubernetes.io/part-of: mcp-grpc-gateway-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-grpc-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-grpc-gateway
        app.kubernetes.io/part-of: mcp-grpc-gateway-example
    spec:
      containers:
        - name: gateway
          image: cadenyaagents/mcp-grpc-gateway:latest
          imagePullPolicy: IfNotPresent
          args:
            - --addr
            - 0.0.0.0:8080
            - --grpc-host
            - greeter:50051
            - --require-tool-annotations
            - --forward-header
            - Authorization
            - --otel-endpoint
            - otel-collector:4317
            - --otel-insecure
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-grpc-gateway
  labels:
    app.kubernetes.io/name: mcp-grpc-gateway
    app.kubernetes.io/part-of: mcp-grpc-gateway-example
spec:
  selector:
    app.kubernetes.io/name: mcp-grpc-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
