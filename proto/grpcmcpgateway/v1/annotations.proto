syntax = "proto3";

package grpcmcpgateway.v1;

import "google/protobuf/descriptor.proto";

option go_package = "cadenya.com/mcp-grpc-gateway/gen/grpcmcpgateway/v1;grpcmcpgatewayv1";

message Tool {
  string name = 1;
  string description = 2;
}

extend google.protobuf.MethodOptions {
  Tool tool = 51000;
}
